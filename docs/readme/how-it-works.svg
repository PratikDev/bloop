<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="How it works: the frame's colour is read back to a value with the frame's own colorbar, checked against NASA source data, and turned into live sound">
  <defs>
    <linearGradient id="sst" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1d4fa8"/>
      <stop offset="0.35" stop-color="#6fc6e8"/>
      <stop offset="0.6" stop-color="#f3d9a4"/>
      <stop offset="0.8" stop-color="#d9622b"/>
      <stop offset="1" stop-color="#7a1414"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#aba4c8"/>
    </marker>
  </defs>
  <rect width="1200" height="260" rx="18" fill="#15122a"/>
  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">
    <!-- 1. The EIC frame's pixel -->
    <g transform="translate(150 0)">
      <rect x="-105" y="40" width="210" height="150" rx="14" fill="#201c3a" stroke="#2c2750"/>
      <rect x="-60" y="62" width="120" height="70" rx="6" fill="url(#sst)"/>
      <rect x="18" y="80" width="18" height="18" fill="none" stroke="#ff9bd4" stroke-width="2.5">
        <animate attributeName="x" values="-50;30;-50" dur="6s" repeatCount="indefinite"/>
      </rect>
      <text y="160" fill="#edeaf6" font-size="18" font-weight="600">EIC frame</text>
      <text y="180" fill="#aba4c8" font-size="13">the pixel's colour</text>
    </g>
    <!-- 2. Its own colorbar -->
    <g transform="translate(450 0)">
      <rect x="-105" y="40" width="210" height="150" rx="14" fill="#201c3a" stroke="#2c2750"/>
      <rect x="-75" y="88" width="150" height="16" rx="3" fill="url(#sst)"/>
      <path d="M0 78 l-7 -10 h14 z" fill="#ff9bd4">
        <animateTransform attributeName="transform" type="translate" values="-65 0;55 0;-65 0" dur="6s" repeatCount="indefinite"/>
      </path>
      <text y="160" fill="#edeaf6" font-size="18" font-weight="600">Its colorbar</text>
      <text y="180" fill="#aba4c8" font-size="13">colour → °C or mm/h</text>
    </g>
    <!-- 3. Checked against NASA -->
    <g transform="translate(750 0)">
      <rect x="-105" y="40" width="210" height="150" rx="14" fill="#201c3a" stroke="#2c2750"/>
      <circle cy="96" r="28" fill="none" stroke="#2c2750" stroke-width="3"/>
      <path d="M-13 96 l9 10 l18 -21" fill="none" stroke="#ff9bd4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="44" stroke-dashoffset="44">
        <animate attributeName="stroke-dashoffset" values="44;0;0;44" keyTimes="0;0.25;0.85;1" dur="3s" repeatCount="indefinite"/>
      </path>
      <text y="160" fill="#edeaf6" font-size="18" font-weight="600">Checked</text>
      <text y="180" fill="#aba4c8" font-size="13">against NASA source data</text>
    </g>
    <!-- 4. Live sound -->
    <g transform="translate(1050 0)">
      <rect x="-105" y="40" width="210" height="150" rx="14" fill="#201c3a" stroke="#2c2750"/>
      <g fill="#ff9bd4">
        <rect x="-44" y="80" width="8" height="32" rx="4"><animate attributeName="height" values="12;40;12" dur="0.9s" repeatCount="indefinite"/><animate attributeName="y" values="90;76;90" dur="0.9s" repeatCount="indefinite"/></rect>
        <rect x="-26" y="80" width="8" height="32" rx="4"><animate attributeName="height" values="36;10;36" dur="0.7s" repeatCount="indefinite"/><animate attributeName="y" values="78;91;78" dur="0.7s" repeatCount="indefinite"/></rect>
        <rect x="-8" y="80" width="8" height="32" rx="4"><animate attributeName="height" values="20;44;20" dur="1.1s" repeatCount="indefinite"/><animate attributeName="y" values="86;74;86" dur="1.1s" repeatCount="indefinite"/></rect>
        <rect x="10" y="80" width="8" height="32" rx="4"><animate attributeName="height" values="40;14;40" dur="0.8s" repeatCount="indefinite"/><animate attributeName="y" values="76;89;76" dur="0.8s" repeatCount="indefinite"/></rect>
        <rect x="28" y="80" width="8" height="32" rx="4"><animate attributeName="height" values="16;34;16" dur="1s" repeatCount="indefinite"/><animate attributeName="y" values="88;79;88" dur="1s" repeatCount="indefinite"/></rect>
      </g>
      <text y="160" fill="#edeaf6" font-size="18" font-weight="600">Live sound</text>
      <text y="180" fill="#aba4c8" font-size="13">pitch, drops, stereo</text>
    </g>
  </g>
  <g stroke="#aba4c8" stroke-width="2" marker-end="url(#arrow)">
    <line x1="262" y1="115" x2="338" y2="115"/>
    <line x1="562" y1="115" x2="638" y2="115"/>
    <line x1="862" y1="115" x2="938" y2="115"/>
  </g>
  <text x="600" y="232" fill="#aba4c8" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle">Every sound traces back to a verified NASA measurement.</text>
</svg>
