<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test 1 — Can a browser read SVS files?</title>
<style>
  body { font: 16px/1.5 system-ui, sans-serif; margin: 2rem auto; max-width: 70rem; padding: 0 1rem; color: #1b1f24; }
  textarea { width: 100%; height: 9rem; font: 13px/1.4 ui-monospace, monospace; }
  button { font: inherit; padding: .5rem 1rem; margin: .5rem .5rem .5rem 0; cursor: pointer; }
  button:focus-visible, textarea:focus-visible { outline: 3px solid #1a5fb4; outline-offset: 2px; }
  table { border-collapse: collapse; width: 100%; margin-top: 1rem; font-size: 14px; }
  th, td { border: 1px solid #c8ccd1; padding: .4rem .5rem; text-align: left; vertical-align: top; word-break: break-all; }
  .pass { color: #0b6b2e; font-weight: 600; } .fail { color: #a61b1b; font-weight: 600; }
  pre { background: #f2f4f7; padding: 1rem; white-space: pre-wrap; }
</style>
</head>
<body>
<h1>Test 1: can a web page read SVS images and API data?</h1>
<p>Open this page from <code>http://localhost:8000/t1_cors_test.html</code> (not by double-clicking the file). One URL per line; edit if needed.</p>
<label for="urls">URLs to test</label>
<textarea id="urls">https://svs.gsfc.nasa.gov/vis/a000000/a005100/a005101/sst_mur_colorbar.png
https://svs.gsfc.nasa.gov/vis/a000000/a004200/a004285/frames/3600x1800_2x1_30p/flatalpha/imergert_alpha.2026-09-17T00:00:00Z.png
https://svs.gsfc.nasa.gov/api/5101
https://svs.gsfc.nasa.gov/vis/a000000/a005100/a005101/frames/4096x2048_2x1_30p/sst_mur_no-dates/
https://power.larc.nasa.gov/api/temporal/daily/point?parameters=T2M&community=AG&longitude=90.41&latitude=23.81&start=20240101&end=20240110&format=JSON
https://api.globe.gov/search/v1/measurement/protocol/measureddate/?protocols=sky_conditions&startdate=2025-03-01&enddate=2025-03-02&geojson=FALSE&sample=TRUE</textarea>
<button id="run">Run test</button><button id="copy">Copy results</button>
<table><thead><tr><th>URL</th><th>A: fetch() with CORS</th><th>B: image pixels (crossOrigin)</th></tr></thead><tbody id="out"></tbody></table>
<pre id="summary" aria-live="polite"></pre>
<script>
const out = document.getElementById('out');
const results = [];
const isImage = u => /\.(png|jpe?g|gif|webp)(\?|$)/i.test(u);

async function testFetch(url) {
  const t0 = performance.now();
  try {
    const r = await fetch(url, { mode: 'cors' });
    const ms = Math.round(performance.now() - t0);
    if (!r.ok) return { ok: false, msg: `HTTP ${r.status} (${ms} ms)` };
    const acao = r.headers.get('access-control-allow-origin');
    const type = r.headers.get('content-type') || '?';
    if (isImage(url)) {
      const bmp = await createImageBitmap(await r.blob());
      const c = new OffscreenCanvas(Math.min(bmp.width, 64), Math.min(bmp.height, 64));
      const g = c.getContext('2d'); g.drawImage(bmp, 0, 0);
      const px = g.getImageData(0, 0, 1, 1).data;
      return { ok: true, msg: `readable (${bmp.width}x${bmp.height}, ${type}, ACAO=${acao}, ${ms} ms, first pixel ${[...px]})` };
    }
    const text = await r.text();
    return { ok: true, msg: `readable (${type}, ACAO=${acao}, ${text.length} chars, ${ms} ms): ${text.slice(0, 120).replace(/\s+/g, ' ')}` };
  } catch (e) {
    return { ok: false, msg: `${e.name}: ${e.message} — usually means the server does not allow cross-site reading (CORS)` };
  }
}

function testImg(url) {
  return new Promise(resolve => {
    if (!isImage(url)) return resolve({ ok: null, msg: 'not an image (skipped)' });
    const img = new Image();
    img.crossOrigin = 'anonymous';
    const timer = setTimeout(() => resolve({ ok: false, msg: 'timeout after 60 s' }), 60000);
    img.onload = () => {
      clearTimeout(timer);
      try {
        const c = document.createElement('canvas'); c.width = 8; c.height = 8;
        const g = c.getContext('2d'); g.drawImage(img, 0, 0, 8, 8);
        g.getImageData(0, 0, 1, 1);
        resolve({ ok: true, msg: `pixels readable (${img.naturalWidth}x${img.naturalHeight})` });
      } catch (e) { resolve({ ok: false, msg: `${e.name}: canvas is tainted — pixels NOT readable` }); }
    };
    img.onerror = () => { clearTimeout(timer); resolve({ ok: false, msg: 'image failed to load with crossOrigin (CORS not allowed or bad URL)' }); };
    img.src = url;
  });
}

const cell = r => r.ok === null ? `<td>${r.msg}</td>` : `<td><span class="${r.ok ? 'pass' : 'fail'}">${r.ok ? 'PASS' : 'FAIL'}</span> ${r.msg}</td>`;

document.getElementById('run').onclick = async () => {
  out.innerHTML = ''; results.length = 0;
  const urls = document.getElementById('urls').value.split('\n').map(s => s.trim()).filter(Boolean);
  for (const url of urls) {
    const row = document.createElement('tr');
    row.innerHTML = `<td>${url}</td><td>testing…</td><td>testing…</td>`;
    out.appendChild(row);
    const [a, b] = await Promise.all([testFetch(url), testImg(url)]);
    row.innerHTML = `<td>${url}</td>${cell(a)}${cell(b)}`;
    results.push({ url, fetch: a, image: b });
  }
  const lines = results.map(r => `${r.url}\n  A fetch: ${r.fetch.ok ? 'PASS' : 'FAIL'} — ${r.fetch.msg}\n  B image: ${r.image.ok === null ? 'skipped' : (r.image.ok ? 'PASS' : 'FAIL')} — ${r.image.msg}`);
  document.getElementById('summary').textContent =
    `TEST 1 RESULTS (${new Date().toISOString()})\nBrowser: ${navigator.userAgent}\nPage origin: ${location.origin}\n\n` + lines.join('\n');
};
document.getElementById('copy').onclick = () => navigator.clipboard.writeText(document.getElementById('summary').textContent);
</script>
</body>
</html>
