# Weekly products (GRACE, SWOT reaches, CERES, NASA-SSH, sea ice, NDVI, ECOSTRESS ET, …): Mondays 03:30 UTC.
name: data-weekly

on:
  schedule:
    - cron: "30 3 * * 1"
  workflow_dispatch:

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  weekly:
    permissions:
      contents: write
      issues: write
    uses: ./.github/workflows/data-run.yml
    with:
      cadence: weekly
    secrets: inherit
