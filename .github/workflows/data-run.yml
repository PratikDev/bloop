# One data refresh (called by data-daily / data-weekly / data-static). Runs pipeline/run_all.py for a cadence;
# commits public/data only if spotcheck.py passed (run_all exits non-zero otherwise), else opens an issue with the
# redacted log tail and keeps the last good data. Keys come from repository secrets, never from files.
name: data-run

on:
  workflow_call:
    inputs:
      cadence:
        required: true
        type: string

permissions:
  contents: write
  issues: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
      EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
      FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
      OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - name: Pipeline (${{ inputs.cadence }})
        working-directory: pipeline
        run: |
          set -o pipefail
          python run_all.py --cadence ${{ inputs.cadence }} 2>&1 | tee ../run.log
      - name: Commit public/data (spotcheck passed)
        run: |
          git config user.name "bloop-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          if git diff --cached --quiet; then echo "No data change."; exit 0; fi
          git commit -m "data: ${{ inputs.cadence }} refresh $(date -u +%Y-%m-%dT%H:%MZ) (spotcheck passed)"
          git pull --rebase
          git push
      - name: Open an issue (the last good data stays)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -c "import sys; sys.path.insert(0, 'pipeline'); from core.ref import T; print(T.redact(open('run.log', encoding='utf-8').read()[-6000:]))" > tail.log || echo "no log" > tail.log
          gh issue create --title "data-${{ inputs.cadence }} failed $(date -u +%F)" --body-file tail.log
